<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>이예근의 주식 분석</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Malgun Gothic',sans-serif;background:#0f141f;color:#e6eaf3}
header{padding:16px 20px;background:#161d2e;border-bottom:1px solid #263050}header h1{margin:0;font-size:19px}
nav{display:flex;gap:6px;padding:10px 20px;flex-wrap:wrap}
nav button{border:0;background:#1d2640;color:#aab4d0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:600}
nav button.on{background:#3b6cff;color:#fff}
section{display:none;padding:0 20px 30px}section.on{display:block}
.card{background:#161d2e;border:1px solid #263050;border-radius:12px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:#1d2640;border-radius:10px;padding:10px}.stat small{color:#8e9ac0}.stat b{display:block;font-size:20px;margin-top:2px}
.pos{color:#3ddc97}.neg{color:#ff6b6b}
input,select,textarea{width:100%;padding:8px;border-radius:8px;border:1px solid #2e3a60;background:#0f141f;color:#e6eaf3;font:inherit}
label{font-size:12px;color:#8e9ac0;display:block;margin-bottom:3px}
.btn{background:#3b6cff;color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:700}
.btn.d{background:#2a3355}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px;border-bottom:1px solid #263050;text-align:left}
.tablewrap{overflow-x:auto}
.chk label{display:flex;gap:8px;align-items:center;font-size:14px;color:#e6eaf3;padding:7px 0;border-bottom:1px solid #263050;cursor:pointer}
.chk input{width:auto}
.go{padding:14px;border-radius:10px;text-align:center;font-weight:800;margin-top:12px;background:#3a2230;color:#ff9b9b}
.go.ok{background:#16382b;color:#3ddc97}
.warn{font-size:12px;color:#8e9ac0;margin-top:10px}
</style></head><body>
<header><h1>📈 이예근의 주식 분석 <span style="font-size:12px;color:#8e9ac0;font-weight:400">ICT/CRT 저널 · 리스크 계산기</span></h1></header>
<nav id="nav"></nav>

<!-- 체크리스트 -->
<section id="s0"><div class="card chk">
<h3 style="margin-top:0">진입 전 체크리스트 (전부 체크해야 진입 허용)</h3>
<div id="cl"></div>
<div id="go" class="go">❌ 조건 미충족 — 진입 금지</div>
<button class="btn d" style="margin-top:10px" onclick="resetCl()">초기화</button>
<div class="warn">체크리스트 항목은 아래 '설정' 영역 코드의 CHECKS 배열에서 본인 규칙에 맞게 고칠 수 있습니다.</div></div></section>

<!-- 리스크 -->
<section id="s1"><div class="card"><h3 style="margin-top:0">포지션 사이즈 계산기</h3>
<div class="grid">
<div><label>계좌 잔고</label><input id="rb" type="number" value="10000000"></div>
<div><label>1회 허용 손실 %</label><input id="rp" type="number" step="0.1" value="1"></div>
<div><label>진입가</label><input id="re" type="number" step="any"></div>
<div><label>손절가</label><input id="rs" type="number" step="any"></div>
<div><label>목표가</label><input id="rt" type="number" step="any"></div>
</div><button class="btn" style="margin-top:10px" onclick="calcRisk()">계산</button>
<div class="grid" style="margin-top:12px" id="rout"></div>
<div class="warn">롱/숏 자동 판별(손절가가 진입가보다 낮으면 롱). 수수료·슬리피지 미포함. 주식은 정수 단위로 내림 처리합니다.</div></div></section>

<!-- 기록 -->
<section id="s2"><div class="card"><h3 style="margin-top:0">매매 기록 추가</h3>
<div class="grid">
<div><label>날짜</label><input id="d" type="date"></div>
<div><label>시장</label><select id="m"><option>국장</option><option>미장</option></select></div>
<div><label>종목</label><input id="sym"></div>
<div><label>방향</label><select id="dir"><option>롱</option><option>숏</option></select></div>
<div><label>셋업</label><select id="setup"><option>CRT</option><option>ICT-FVG</option><option>ICT-OB</option><option>유동성 스윕</option><option>기타</option></select></div>
<div><label>진입가</label><input id="en" type="number" step="any"></div>
<div><label>손절가</label><input id="sl" type="number" step="any"></div>
<div><label>청산가</label><input id="ex" type="number" step="any"></div>
<div><label>수량</label><input id="qty" type="number"></div>
<div><label>수수료 합계</label><input id="fee" type="number" value="0"></div>
<div><label>킬존 준수?</label><select id="kz"><option>예</option><option>아니오</option></select></div>
<div><label>감정</label><select id="emo"><option>평온</option><option>FOMO</option><option>복수매매</option><option>불안</option><option>과신</option></select></div>
</div>
<label style="margin-top:8px">메모/복기</label><textarea id="note" rows="2"></textarea>
<button class="btn" style="margin-top:10px" onclick="addTrade()">저장</button></div>
<div class="card tablewrap"><table><thead><tr><th>날짜</th><th>시장</th><th>종목</th><th>방향</th><th>셋업</th><th>손익</th><th>R</th><th>감정</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
<button class="btn d" onclick="exportCsv()">CSV 내보내기</button>
</section>

<!-- 통계 -->
<section id="s3"><div class="grid" id="st"></div>
<div class="card" style="margin-top:14px"><h3 style="margin-top:0">셋업별 성과</h3><div class="tablewrap"><table id="bySetup"></table></div></div>
<div class="card"><h3 style="margin-top:0">감정 상태별 성과 (손실 패턴 찾기)</h3><div class="tablewrap"><table id="byEmo"></table></div></div>
<div class="card"><h3 style="margin-top:0">자동 진단</h3><div id="diag"></div></div>
</section>

<script>
const CHECKS=['HTF(일/4H) 바이어스 확인했다','주요 유동성(전고/전저·EQH/EQL) 위치 파악','유동성 스윕 또는 CRT 범위 돌파 후 복귀 확인','변위(Displacement) + FVG/OB 확인','킬존(진입 허용 시간대)이다','손절 위치가 구조상 명확하다','손익비 최소 1:2 이상이다','1회 손실이 계좌의 허용 % 이내다','뉴스/실적 발표 일정 확인했다','감정이 평온하다 (복수/FOMO 아님)'];
const nav=document.getElementById('nav');
['✅ 체크리스트','🧮 리스크 계산','📝 매매 기록','📊 통계'].forEach((t,i)=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>show(i);nav.appendChild(b)});
function show(i){document.querySelectorAll('section').forEach((s,j)=>s.classList.toggle('on',i==j));[...nav.children].forEach((b,j)=>b.classList.toggle('on',i==j));if(i==3)stats()}
show(0);
// checklist
const cl=document.getElementById('cl');
CHECKS.forEach((c,i)=>{const l=document.createElement('label');l.innerHTML=`<input type="checkbox"> ${c}`;l.firstChild.onchange=upd;cl.appendChild(l)});
function upd(){const all=[...cl.querySelectorAll('input')].every(x=>x.checked);const g=document.getElementById('go');g.className='go'+(all?' ok':'');g.textContent=all?'✅ 조건 충족 — 계획대로 진입':'❌ 조건 미충족 — 진입 금지'}
function resetCl(){cl.querySelectorAll('input').forEach(x=>x.checked=false);upd()}
// risk
function calcRisk(){const b=+rb.value,p=+rp.value,e=+re.value,s=+rs.value,t=+rt.value;if(!b||!e||!s||e==s){rout.innerHTML='<div class="stat">값을 입력하세요</div>';return}
const risk=b*p/100,per=Math.abs(e-s),q=Math.floor(risk/per),cost=q*e;const long=s<e;
let rr=t?Math.abs(t-e)/per:null;const valid=t?((long&&t>e)||(!long&&t<e)):true;
const box=(a,v)=>`<div class="stat"><small>${a}</small><b>${v}</b></div>`;
rout.innerHTML=box('방향',long?'롱':'숏')+box('허용 손실',Math.round(risk).toLocaleString())+box('권장 수량',q.toLocaleString())+box('투입 금액',Math.round(cost).toLocaleString())+box('계좌 대비 비중',(cost/b*100).toFixed(1)+'%')+(t?box('손익비',valid?('1:'+rr.toFixed(2)):'목표가 방향 오류'):'')+(t&&valid?box('예상 이익',Math.round(q*Math.abs(t-e)).toLocaleString()):'')}
// trades
let T=JSON.parse(localStorage.getItem('trades')||'[]');d.valueAsDate=new Date();
function pnl(x){const g=(x.dir=='롱'?x.ex-x.en:x.en-x.ex)*x.qty;return g-x.fee}
function rmul(x){const r=Math.abs(x.en-x.sl)*x.qty;return r?pnl(x)/r:0}
function addTrade(){const x={d:d.value,m:m.value,sym:sym.value,dir:dir.value,setup:setup.value,en:+en.value,sl:+sl.value,ex:+ex.value,qty:+qty.value,fee:+fee.value||0,kz:kz.value,emo:emo.value,note:note.value};
if(!x.sym||!x.en||!x.sl||!x.ex||!x.qty){alert('종목/진입/손절/청산/수량은 필수');return}
T.push(x);save();sym.value=en.value=sl.value=ex.value=qty.value=note.value=''}
function save(){localStorage.setItem('trades',JSON.stringify(T));draw()}
const f=n=>Math.round(n).toLocaleString();
function draw(){tb.innerHTML='';T.forEach((x,i)=>{const p=pnl(x),r=rmul(x);const tr=document.createElement('tr');tr.innerHTML=`<td>${x.d}</td><td>${x.m}</td><td>${esc(x.sym)}</td><td>${x.dir}</td><td>${x.setup}</td><td class="${p>=0?'pos':'neg'}">${f(p)}</td><td>${r.toFixed(2)}R</td><td>${x.emo}</td><td><button class="btn d">삭제</button></td>`;tr.querySelector('button').onclick=()=>{T.splice(i,1);save()};tb.appendChild(tr)})}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function agg(key){const g={};T.forEach(x=>{(g[x[key]]=g[x[key]]||[]).push(x)});return g}
function tableFor(el,key){const g=agg(key);let h='<tr><th>구분</th><th>횟수</th><th>승률</th><th>총손익</th><th>평균R</th></tr>';Object.entries(g).forEach(([k,a])=>{const w=a.filter(x=>pnl(x)>0).length,s=a.reduce((z,x)=>z+pnl(x),0),r=a.reduce((z,x)=>z+rmul(x),0)/a.length;h+=`<tr><td>${k}</td><td>${a.length}</td><td>${(w/a.length*100).toFixed(0)}%</td><td class="${s>=0?'pos':'neg'}">${f(s)}</td><td>${r.toFixed(2)}R</td></tr>`});document.getElementById(el).innerHTML=h}
function stats(){const n=T.length;const box=(a,v,c='')=>`<div class="stat"><small>${a}</small><b class="${c}">${v}</b></div>`;
if(!n){st.innerHTML=box('기록 없음','매매를 입력하세요');bySetup.innerHTML=byEmo.innerHTML=diag.innerHTML='';return}
const P=T.map(pnl),W=P.filter(p=>p>0),L=P.filter(p=>p<=0),tot=P.reduce((a,b)=>a+b,0);
const gw=W.reduce((a,b)=>a+b,0),gl=Math.abs(L.reduce((a,b)=>a+b,0));const wr=W.length/n;
const avgW=W.length?gw/W.length:0,avgL=L.length?gl/L.length:0;const exp=tot/n;
let eq=0,peak=0,mdd=0;P.forEach(p=>{eq+=p;peak=Math.max(peak,eq);mdd=Math.max(mdd,peak-eq)});
let streak=0,maxs=0;P.forEach(p=>{if(p<=0){streak++;maxs=Math.max(maxs,streak)}else streak=0});
const avgR=T.reduce((a,x)=>a+rmul(x),0)/n;
st.innerHTML=box('총 거래',n)+box('총 손익',f(tot),tot>=0?'pos':'neg')+box('승률',(wr*100).toFixed(1)+'%')+box('평균 이익/손실',f(avgW)+' / '+f(avgL))+box('Profit Factor',gl?(gw/gl).toFixed(2):'∞')+box('거래당 기대값',f(exp),exp>=0?'pos':'neg')+box('평균 R',avgR.toFixed(2)+'R')+box('최대 낙폭',f(mdd),'neg')+box('최대 연패',maxs+'연패');
tableFor('bySetup','setup');tableFor('byEmo','emo');
const out=[];
const kzN=T.filter(x=>x.kz=='아니오');if(kzN.length>=3){const s=kzN.reduce((a,x)=>a+pnl(x),0);out.push(`킬존 밖 진입 ${kzN.length}회, 손익 ${f(s)} ${s<0?'→ 손실 원인일 가능성. 킬존 밖 진입을 중단해 보세요.':''}`)}
['FOMO','복수매매','과신','불안'].forEach(e=>{const a=T.filter(x=>x.emo==e);if(a.length>=3){const s=a.reduce((z,x)=>z+pnl(x),0);if(s<0)out.push(`'${e}' 상태 매매 ${a.length}회 합계 ${f(s)} → 이 상태에서는 매매 금지 규칙 추천`)}});
if(n>=10&&exp<0)out.push('기대값이 마이너스입니다. 사이즈를 줄이고 셋업별 성과에서 이익 나는 것만 남기세요.');
if(avgW&&avgL&&avgW<avgL&&wr<.6)out.push('평균 손실이 평균 이익보다 큽니다. 손절 이동/조기 익절 습관을 점검하세요.');
if(n<30)out.push(`표본이 ${n}건입니다. 통계적 신뢰를 위해 최소 30건 이상 기록하세요.`);
diag.innerHTML=out.length?out.map(o=>`<p>• ${o}</p>`).join(''):'<p>특이 패턴이 아직 없습니다.</p>';}
function exportCsv(){const h='날짜,시장,종목,방향,셋업,진입,손절,청산,수량,수수료,킬존,감정,손익,R,메모\n';const r=T.map(x=>[x.d,x.m,x.sym,x.dir,x.setup,x.en,x.sl,x.ex,x.qty,x.fee,x.kz,x.emo,pnl(x),rmul(x).toFixed(2),'"'+(x.note||'').replace(/"/g,'""')+'"'].join(',')).join('\n');
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+h+r],{type:'text/csv'}));a.download='trades.csv';a.click()}
draw();
</script></body></html>
